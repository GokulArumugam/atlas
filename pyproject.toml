[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-analyst"
version = "0.2.0"
description = "An AI data analyst that enforces who's allowed to see what — with a fail-closed SQL firewall and a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gokul Arumugam" }]
keywords = ["text-to-sql", "data-governance", "sql-firewall", "duckdb", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pins are exact for security-critical deps: sqlglot is the entire firewall
# parsing boundary, so any behaviour change must be a deliberate, tested bump.
dependencies = [
    "duckdb==1.1.3",
    "sqlglot==26.0.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "httpx==0.27.2",
    "starlette==0.41.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2", "pytest-asyncio==0.24.0"]
postgres = ["psycopg[binary,pool]==3.2.3"]
postgres-legacy = ["psycopg2-binary==2.9.10"]

[project.urls]
Homepage = "https://github.com/GokulArumugam/atlas"
Repository = "https://github.com/GokulArumugam/atlas"

[project.scripts]
atlas-serve = "atlas.api.app:serve"
atlas-demo = "atlas.demo:main"
atlas-generate = "atlas.data.generate:generate"
atlas-mint-key = "atlas.api.keys_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
